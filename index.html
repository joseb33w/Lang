<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Languages - Hello World Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            margin: 20px 0;
            text-align: center;
        }

        #searchInput {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .languages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .language-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .language-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }

        .language-card.active {
            border: 3px solid #667eea;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .language-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .language-code {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin: 10px 0;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .run-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .run-button:hover {
            background: #5568d3;
        }

        .run-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            min-height: 50px;
            display: none;
        }

        .output.show {
            display: block;
        }

        .output.success {
            border-left: 4px solid #4caf50;
        }

        .output.error {
            border-left: 4px solid #f44336;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .badge.browser {
            background: #4caf50;
            color: white;
        }

        .badge.server {
            background: #ff9800;
            color: white;
        }

        .stats {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stats h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .counter {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .projects-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .projects-toggle {
            background: #f5f5f5;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            color: #667eea;
            width: 100%;
            text-align: left;
            transition: background 0.2s;
        }

        .projects-toggle:hover {
            background: #e8e8e8;
        }

        .projects-list {
            margin-top: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            display: none;
            font-size: 0.85em;
            line-height: 1.6;
        }

        .projects-list.show {
            display: block;
        }

        .project-item {
            padding: 4px 0;
            color: #555;
        }

        .project-item::before {
            content: "• ";
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

        function renderLanguages(filteredLanguages = languages) {
            const grid = document.getElementById('languagesGrid');
            grid.innerHTML = '';

            filteredLanguages.forEach((lang, index) => {
                const card = document.createElement('div');
                card.className = 'language-card';
                card.dataset.index = index;

                const badge = lang.runnable ? 
                    '<span class="badge browser">Runnable in Browser</span>' : 
                    '<span class="badge server">Server-side</span>';

                const projectsHtml = lang.projects ? `
                    <div class="projects-section">
                        <button class="projects-toggle" onclick="toggleProjects(${index}, event)">
                            📋 Common Projects <span id="toggle-${index}">▼</span>
                        </button>
                        <div class="projects-list" id="projects-${index}">
                            ${lang.projects.map(p => `<div class="project-item">${escapeHtml(p)}</div>`).join('')}
                        </div>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="language-name">
                        ${lang.name}
                        ${badge}
                    </div>
                    <div class="language-code">${escapeHtml(lang.code)}</div>
                    ${lang.runnable ? 
                        `<button class="run-button" onclick="runCode(${index}, event)">▶ Run Code</button>
                         <div class="output" id="output-${index}"></div>` : 
                        `<p style="color: #666; font-size: 0.9em; margin-top: 10px;">💡 This language requires a server-side runtime</p>`
                    }
                    ${projectsHtml}
                `;

                grid.appendChild(card);
            });

            document.getElementById('totalCount').textContent = filteredLanguages.length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function runCode(index, event) {
            event.stopPropagation();
            const lang = languages[index];
            const outputDiv = document.getElementById(`output-${index}`);
            
            if (!lang.runnable) return;

            outputDiv.className = 'output show';
            outputDiv.innerHTML = '<span style="color: #888;">Running...</span>';

            try {
                if (lang.name === 'JavaScript') {
                    const originalLog = console.log;
                    let output = '';
                    console.log = (...args) => {
                        output += args.join(' ') + '\n';
                    };
                    
                    eval(lang.code);
                    console.log = originalLog;
                    
                    outputDiv.className = 'output show success';
                    outputDiv.innerHTML = `<pre>${escapeHtml(output.trim() || 'Code executed successfully!')}</pre>`;
                } else if (lang.name === 'TypeScript') {
                    // Strip TypeScript type annotations to run as JavaScript
                    // Match type annotations in function signatures and variable declarations
                    let jsCode = lang.code
                        .replace(/\)\s*:\s*\w+\s*\{/g, ') {') // Remove function return types: function(): type {
                        .replace(/\(\s*([^:)]+)\s*:\s*\w+\s*\)/g, '($1)') // Remove parameter types: (param: type)
                        .replace(/:\s*void\s*/g, '') // Remove : void
                        .replace(/:\s*string\s*/g, '') // Remove : string
                        .replace(/:\s*number\s*/g, '') // Remove : number
                        .replace(/:\s*boolean\s*/g, '') // Remove : boolean
                        .replace(/<[^>]+>/g, '') // Remove generic types
                        .trim();
                    
                    const originalLog = console.log;
                    let output = '';
                    console.log = (...args) => {
                        output += args.join(' ') + '\n';
                    };
                    
                    try {
                        eval(jsCode);
                        console.log = originalLog;
                        
                        outputDiv.className = 'output show success';
                        outputDiv.innerHTML = `<pre>${escapeHtml(output.trim() || 'Code executed successfully!')}</pre>`;
                    } catch (tsError) {
                        console.log = originalLog;
                        throw tsError;
                    }
                }
            } catch (error) {
                outputDiv.className = 'output show error';
                outputDiv.innerHTML = `<pre>Error: ${escapeHtml(error.message)}</pre>`;
            }
        }

        function toggleProjects(index, event) {
            event.stopPropagation();
            const projectsDiv = document.getElementById(`projects-${index}`);
            const toggleSpan = document.getElementById(`toggle-${index}`);
            
            if (projectsDiv.classList.contains('show')) {
                projectsDiv.classList.remove('show');
                toggleSpan.textContent = '▼';
            } else {
                projectsDiv.classList.add('show');
                toggleSpan.textContent = '▲';
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = languages.filter(lang => 
                lang.name.toLowerCase().includes(searchTerm) ||
                lang.code.toLowerCase().includes(searchTerm) ||
                (lang.projects && lang.projects.some(p => p.toLowerCase().includes(searchTerm)))
            );
            renderLanguages(filtered);
        });

        renderLanguages();
    </script>
</body>
</html>
